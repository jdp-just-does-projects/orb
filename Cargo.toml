[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jdp-just-does-projects/orb"

[workspace.dependencies]
orb-core = { path = "crates/orb-core" }
orb-db = { path = "crates/orb-db" }
orb-meta = { path = "crates/orb-meta" }
orb-media = { path = "crates/orb-media" }
orb-ml = { path = "crates/orb-ml" }
orb-index = { path = "crates/orb-index" }
orb-jobs = { path = "crates/orb-jobs" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
clap = { version = "4", features = ["derive"] }
blake3 = "1"
walkdir = "2"
camino = { version = "1", features = ["serde1"] }
directories = "6"

# Dev profile: optimise dependencies (image/ml code is unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
