name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # oldest glibc for AppImage/deb compatibility; CI tests on 24.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-14
            args: "--target aarch64-apple-darwin"
          - os: macos-13
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake clang
          rm -f .cargo/config.toml
      - run: pnpm install --frozen-lockfile
      - name: Fetch ffmpeg sidecars
        if: runner.os != 'macOS'
        shell: bash
        run: scripts/fetch-sidecars.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY / APPLE_* secrets are added when signing is set up (Phase 6)
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "orb ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
